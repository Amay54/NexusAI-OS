version: '3.8'

services:
  nexusai-control-plane:
    build: .
    container_name: nexusai-control-plane
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://nexus:nexuspass@postgres:5432/nexusai_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - redis
      - postgres
      - qdrant
    restart: always

  redis:
    image: redis:7-alpine
    container_name: nexusai-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    container_name: nexusai-postgres
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=nexuspass
      - POSTGRES_DB=nexusai_db
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nexusai-qdrant
    ports:
      - "6333:6333"

  prometheus:
    image: prom/prometheus:latest
    container_name: nexusai-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
